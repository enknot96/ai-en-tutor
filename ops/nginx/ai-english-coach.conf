# /etc/nginx/sites-available/ai-english-coach
# Replace coach.example.com with your own subdomain.
# Run `sudo certbot --nginx` after DNS works; certbot adds the 443 block and the http -> https redirect.

# Rate limit for endpoints that spend OpenAI credit (6 requests per minute per IP)
limit_req_zone $binary_remote_addr zone=costly_api:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name coach.example.com;

    server_tokens off;
    limit_req_status 429;

    location = /api/realtime/session {
        limit_req zone=costly_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy-common.conf;
    }

    location = /api/lessons/prepare {
        limit_req zone=costly_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include snippets/proxy-common.conf;
    }
}
